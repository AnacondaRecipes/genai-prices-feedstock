{% set name = "genai-prices" %}
{% set version = "0.1.6" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 802c1e4cc3ed5e70a09083b83af441a58d91f62e12768f7f1b6b26c98a33fcac

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - hatchling
    - uv-dynamic-versioning >=0.7.0
  run:
    - python
    - httpx2 >=2.0
    - pydantic >=2.10
  run_constrained:
    # CLI extra (https://github.com/pydantic/genai-prices/blob/v0.1.6/packages/python/pyproject.toml#L42-L46)
    - pydantic-settings >=2.11
    - rich >=14.3.2
    - rich-argparse >=1.7.2

test:
  imports:
    - genai_prices
  requires:
    - pip
  commands:
    - pip check
    # genai-prices --help requires the [cli] extras (pydantic-settings,
    # rich, rich-argparse) which live in run_constrained, not run.
    # Skip the CLI smoke test to keep the test env minimal.

about:
  home: https://github.com/pydantic/genai-prices
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Calculate prices for calling LLM inference APIs.
  description: |
    genai-prices is a Python library that calculates prices for calling
    LLM inference APIs across different providers (OpenAI, Anthropic,
    Google, AWS Bedrock, etc.). It also ships a CLI for ad-hoc lookups.
  doc_url: https://github.com/pydantic/genai-prices
  dev_url: https://github.com/pydantic/genai-prices

extra:
  recipe-maintainers:
    - moritzwilksch
    - xkong-anaconda
